name: Build and release container
run-name: ${{ github.actor }} build
on:
  workflow_dispatch:
  #schedule:
  #  - cron: "22 14 4 * *" # Build once per month
  push:
    branches:
      - CICD
    paths-ignore:
      - .github/workflows/*
      - .gitea/workflows/*
      - .gitlab-ci.*

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Set RELEASE_DATE
        run: |
          set -x
          echo "RELEASE_DATE=$(date --rfc-3339=date)" >> ${GITHUB_ENV}
          echo "REPO_NAME=$(echo ${{ github.repository }} | sed -E 's,.+/([^/]+),\1,')" >> ${GITHUB_ENV}
          git clone https://github.com/iv-org/invidious.git
          cd ${{ github.workspace }}/invidious && patch -p0 < ../invidious-login_only.diff.txt
          mv * ${{ github.workspace }}/
          cd ${{ github.workspace }}/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker AMD64/ARM64 image for latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.arm64
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/${{ github.repository }}:latest
            docker.io/${{ github.actor }}/${{ github.repository }}:latest
            docker.io/${{ github.actor }}/${{ github.repository }}:${{ env.RELEASE_DATE }}

